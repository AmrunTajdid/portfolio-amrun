<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="chartBarEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="chartBarSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas (Rich Matte Midnight) -->
  <rect width="1200" height="750" fill="#0c0d12" />

  <!-- Top Window Header (Minimalist Clean, No Toy Dots) -->
  <rect x="0" y="0" width="1200" height="60" fill="#12141c" />
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#1f2433" stroke-width="1" />
  
  <!-- Breadcrumb / App Title -->
  <text x="32" y="36" fill="#f1f5f9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700">KeuanganKeluarga</text>
  <text x="180" y="36" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13">/ Ringkasan Finansial Rumah Tangga</text>
  
  <rect x="980" y="16" width="190" height="28" rx="8" fill="#181b26" stroke="#252a3b" />
  <circle cx="1000" cy="30" r="3.5" fill="#10b981" />
  <text x="1015" y="34" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="500">Keluarga Amrun (Aktif)</text>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="60" width="220" height="690" fill="#0f1118" />
  <line x1="220" y1="60" x2="220" y2="750" stroke="#1f2433" stroke-width="1" />

  <!-- Sidebar Nav Items -->
  <g transform="translate(20, 95)">
    <!-- Active Nav -->
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#181b26" stroke="#2a3044" stroke-width="1" />
    <text x="24" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Ringkasan Utama</text>

    <text x="24" y="68" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Transaksi Kas</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Alokasi Anggaran</text>
    <text x="24" y="156" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Dompet &amp; Rekening</text>
    <text x="24" y="200" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Target Tabungan</text>
    <text x="24" y="244" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Anggota Keluarga</text>
    <text x="24" y="288" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Laporan Bulanan PDF</text>
  </g>

  <!-- 4 SUMMARY CARDS (Top Row) -->
  <!-- Card 1: Total Saldo -->
  <g transform="translate(250, 85)">
    <rect width="215" height="110" rx="14" fill="#12141c" stroke="#1f2433" stroke-width="1" />
    <text x="20" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">TOTAL SALDO BERJALAN</text>
    <text x="20" y="66" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">Rp 48.250.000</text>
    <rect x="20" y="80" width="85" height="18" rx="4" fill="#10b981" fill-opacity="0.1" />
    <text x="27" y="93" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">▲ +12% bln lalu</text>
  </g>

  <!-- Card 2: Pemasukan -->
  <g transform="translate(485, 85)">
    <rect width="215" height="110" rx="14" fill="#12141c" stroke="#1f2433" stroke-width="1" />
    <text x="20" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">PEMASUKAN BULAN INI</text>
    <text x="20" y="66" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">Rp 16.500.000</text>
    <text x="20" y="93" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Gaji &amp; Usaha Mandiri</text>
  </g>

  <!-- Card 3: Pengeluaran -->
  <g transform="translate(720, 85)">
    <rect width="215" height="110" rx="14" fill="#12141c" stroke="#1f2433" stroke-width="1" />
    <text x="20" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">PENGELUARAN BULAN INI</text>
    <text x="20" y="66" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">Rp 7.850.000</text>
    <text x="20" y="93" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">52% dari batas budget</text>
  </g>

  <!-- Card 4: Sisa Kas & Savings Rate -->
  <g transform="translate(955, 85)">
    <rect width="215" height="110" rx="14" fill="#12141c" stroke="#1f2433" stroke-width="1" />
    <text x="20" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">TABUNGAN BERSIH</text>
    <text x="20" y="66" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">+Rp 8.650.000</text>
    <rect x="20" y="80" width="115" height="18" rx="4" fill="#181b26" />
    <text x="26" y="93" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Savings Rate: 52%</text>
  </g>

  <!-- MAIN CHART: Arus Kas 6 Bulan (Bar Chart) -->
  <g transform="translate(250, 220)">
    <rect width="570" height="300" rx="14" fill="#12141c" stroke="#1f2433" stroke-width="1" />
    <text x="25" y="36" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Tren Arus Kas 6 Bulan Terakhir</text>
    <text x="25" y="56" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Pemasukan vs Pengeluaran per Bulan</text>

    <!-- Legend -->
    <rect x="420" y="28" width="10" height="10" rx="2" fill="#10b981" />
    <text x="435" y="37" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Pemasukan</text>
    <rect x="495" y="28" width="10" height="10" rx="2" fill="#475569" />
    <text x="510" y="37" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Pengeluaran</text>

    <!-- Chart Grid Lines -->
    <line x1="45" y1="100" x2="530" y2="100" stroke="#1e2333" stroke-dasharray="2,2" />
    <line x1="45" y1="150" x2="530" y2="150" stroke="#1e2333" stroke-dasharray="2,2" />
    <line x1="45" y1="200" x2="530" y2="200" stroke="#1e2333" stroke-dasharray="2,2" />
    <line x1="45" y1="240" x2="530" y2="240" stroke="#2a3044" stroke-width="1" />

    <!-- Bars for 6 Months -->
    <!-- Mei -->
    <rect x="65" y="120" width="22" height="120" rx="3" fill="url(#chartBarEmerald)" />
    <rect x="90" y="160" width="22" height="80" rx="3" fill="url(#chartBarSlate)" />
    <text x="88" y="260" fill="#94a3b8" font-size="11" text-anchor="middle">Mei</text>

    <!-- Jun -->
    <rect x="145" y="110" width="22" height="130" rx="3" fill="url(#chartBarEmerald)" />
    <rect x="170" y="155" width="22" height="85" rx="3" fill="url(#chartBarSlate)" />
    <text x="168" y="260" fill="#94a3b8" font-size="11" text-anchor="middle">Jun</text>

    <!-- Jul -->
    <rect x="225" y="130" width="22" height="110" rx="3" fill="url(#chartBarEmerald)" />
    <rect x="250" y="170" width="22" height="70" rx="3" fill="url(#chartBarSlate)" />
    <text x="248" y="260" fill="#94a3b8" font-size="11" text-anchor="middle">Jul</text>

    <!-- Agu -->
    <rect x="305" y="95" width="22" height="145" rx="3" fill="url(#chartBarEmerald)" />
    <rect x="330" y="150" width="22" height="90" rx="3" fill="url(#chartBarSlate)" />
    <text x="328" y="260" fill="#94a3b8" font-size="11" text-anchor="middle">Agu</text>

    <!-- Sep -->
    <rect x="385" y="105" width="22" height="135" rx="3" fill="url(#chartBarEmerald)" />
    <rect x="410" y="165" width="22" height="75" rx="3" fill="url(#chartBarSlate)" />
    <text x="408" y="260" fill="#94a3b8" font-size="11" text-anchor="middle">Sep</text>

    <!-- Okt (Current) -->
    <rect x="465" y="90" width="22" height="150" rx="3" fill="url(#chartBarEmerald)" />
    <rect x="490" y="175" width="22" height="65" rx="3" fill="url(#chartBarSlate)" />
    <text x="488" y="260" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Okt</text>
  </g>

  <!-- SECONDARY CHART: Donut Chart Kategori Pengeluaran -->
  <g transform="translate(840, 220)">
    <rect width="330" height="300" rx="14" fill="#12141c" stroke="#1f2433" stroke-width="1" />
    <text x="20" y="36" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Komposisi Pengeluaran</text>
    <text x="20" y="56" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Kategori belanja Oktober</text>

    <!-- Donut Circle Representation -->
    <circle cx="105" cy="165" r="60" fill="none" stroke="#334155" stroke-width="20" stroke-dasharray="140 240" />
    <circle cx="105" cy="165" r="60" fill="none" stroke="#475569" stroke-width="20" stroke-dasharray="80 300" stroke-dashoffset="-140" />
    <circle cx="105" cy="165" r="60" fill="none" stroke="#10b981" stroke-width="20" stroke-dasharray="60 320" stroke-dashoffset="-220" />
    <circle cx="105" cy="165" r="60" fill="none" stroke="#64748b" stroke-width="20" stroke-dasharray="40 340" stroke-dashoffset="-280" />
    <text x="105" y="162" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Rp 7,85 Jt</text>
    <text x="105" y="178" fill="#64748b" font-size="10" text-anchor="middle">Total Expense</text>

    <!-- Legend List -->
    <g transform="translate(195, 105)">
      <circle cx="6" cy="10" r="4" fill="#334155" />
      <text x="18" y="14" fill="#cbd5e1" font-size="11">Dapur (42%)</text>

      <circle cx="6" cy="38" r="4" fill="#475569" />
      <text x="18" y="42" fill="#cbd5e1" font-size="11">Listrik &amp; Wifi (24%)</text>

      <circle cx="6" cy="66" r="4" fill="#10b981" />
      <text x="18" y="70" fill="#cbd5e1" font-size="11">Pendidikan (18%)</text>

      <circle cx="6" cy="94" r="4" fill="#64748b" />
      <text x="18" y="98" fill="#cbd5e1" font-size="11">Transport (16%)</text>
    </g>
  </g>

  <!-- BOTTOM ROW: Rekening Kas & Target Tabungan -->
  <g transform="translate(250, 540)">
    <rect width="920" height="175" rx="14" fill="#12141c" stroke="#1f2433" stroke-width="1" />
    <text x="25" y="32" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Status Rekening Dompet &amp; Rencana Tabungan</text>

    <!-- 3 Wallets -->
    <g transform="translate(25, 55)">
      <rect width="260" height="95" rx="8" fill="#181b26" stroke="#252a3b" />
      <text x="16" y="28" fill="#94a3b8" font-size="11" font-weight="600">BANK CENTRAL ASIA (BCA)</text>
      <text x="16" y="56" fill="#ffffff" font-size="17" font-weight="700">Rp 28.450.000</text>
      <text x="16" y="80" fill="#34d399" font-size="11">Kas Operasional Bulanan</text>
    </g>

    <g transform="translate(305, 55)">
      <rect width="260" height="95" rx="8" fill="#181b26" stroke="#252a3b" />
      <text x="16" y="28" fill="#94a3b8" font-size="11" font-weight="600">BANK SYARIAH INDONESIA (BSI)</text>
      <text x="16" y="56" fill="#ffffff" font-size="17" font-weight="700">Rp 16.800.000</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="11">Tabungan Dana Haji &amp; Qurban</text>
    </g>

    <!-- Savings Goal Progress -->
    <g transform="translate(585, 55)">
      <rect width="310" height="95" rx="8" fill="#181b26" stroke="#252a3b" />
      <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">TARGET: DANA DARURAT (6 BULAN)</text>
      <text x="16" y="52" fill="#ffffff" font-size="15" font-weight="700">Rp 30.000.000 / Rp 40.000.000</text>
      <!-- Progress Bar -->
      <rect x="16" y="65" width="278" height="8" rx="4" fill="#252a3b" />
      <rect x="16" y="65" width="208" height="8" rx="4" fill="#10b981" />
      <text x="16" y="90" fill="#34d399" font-size="11" font-weight="600">75% Tercapai (Kurang Rp 10 Juta)</text>
    </g>
  </g>
</svg>